[project]
name = "aiji"
version = "0.8.3"
description = "分层记忆系统：SQLite 事实/画像 + 会话缓冲 + 可选向量索引；异步写、100ms 硬超时快召回"
requires-python = ">=3.12"
dependencies = ["websockets>=12"]

[project.scripts]
aiji = "aiji.senses.cli:main"

[project.optional-dependencies]
im = ["octop-gateway>=1.0.3"]
voice = ["edge-tts>=7"]
mcp = ["mcp>=2.1"]
dev = ["hypothesis>=6", "ruff>=0.6"]

[tool.uv]
package = true

# 只跑"真错误"这一档：语法错误、未定义名、未用导入、未用变量。
# 不启用 I001（导入排序）——本项目按九大身体系统分组导入，按字母重排会打乱分层意图。
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E9", "F"]

[tool.setuptools.packages.find]
include = ["aiji*"]
exclude = ["bench*", "config*", "data*", "tests*", "tools*"]

[tool.setuptools.package-data]
aiji = ["right_hand/web/*.html"]
