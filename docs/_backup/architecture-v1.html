<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIJiYi 全项目架构图</title>
<style>
  :root{
    --bg:#070c15; --bg2:#0b1220; --line:#1c2a41; --txt:#e6eefb; --sub:#8ea3bf;
    --flow:#7dd3fc; --async:#fbbf24; --data:#94a3b8; --db:#7c8ea8; --ext:#f472b6;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:radial-gradient(1200px 700px at 18% -10%,#12203a 0%,transparent 60%),
               radial-gradient(900px 600px at 100% 0%,#101a2e 0%,transparent 55%),var(--bg);
    color:var(--txt);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
    display:flex;flex-direction:column;overflow:hidden;
  }
  /* ── 顶栏 ───────────────────────────────────────────── */
  header{flex:0 0 auto;padding:12px 18px 10px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,rgba(11,18,32,.96),rgba(11,18,32,.72));backdrop-filter:blur(8px);z-index:5}
  .row1{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .brand{display:flex;align-items:baseline;gap:10px}
  .brand h1{margin:0;font-size:17px;letter-spacing:.3px;font-weight:650}
  .brand .ver{font:11px/1 ui-monospace,SFMono-Regular,Consolas,monospace;color:#5b7a9e}
  .stats{display:flex;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--sub)}
  .stat{padding:2px 8px;border:1px solid var(--line);border-radius:999px;background:rgba(148,163,184,.06);white-space:nowrap}
  .stat b{color:#cfe3ff;font-weight:600}
  .spacer{flex:1 1 auto}
  .tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .btn{border:1px solid var(--line);background:rgba(148,163,184,.07);color:var(--txt);
    padding:6px 11px;border-radius:8px;font-size:12px;cursor:pointer;transition:.15s}
  .btn:hover{background:rgba(125,211,252,.14);border-color:#2a4a6b}
  .btn.on{background:rgba(125,211,252,.2);border-color:#3b82f6;color:#eaf6ff}
  input[type=search]{width:230px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);
    background:rgba(4,9,17,.75);color:var(--txt);font-size:12px;outline:none}
  input[type=search]:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.16)}
  .row2{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;align-items:center}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:11px;
    border:1px solid var(--line);cursor:pointer;user-select:none;color:#c3d3e8;background:rgba(148,163,184,.05)}
  .chip i{width:7px;height:7px;border-radius:2px;display:inline-block}
  .chip.off{opacity:.38;text-decoration:line-through}
  .legend{display:flex;gap:12px;font-size:11px;color:var(--sub);margin-left:auto;align-items:center;flex-wrap:wrap}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .legend svg{overflow:visible}
  /* ── 画布 ───────────────────────────────────────────── */
  main{position:relative;flex:1 1 auto;overflow:hidden}
  #stage{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
  #stage.dragging{cursor:grabbing}
  .band-bg{fill:rgba(148,163,184,.035);stroke:rgba(148,163,184,.12);stroke-dasharray:3 6;rx:14}
  .band-label{font-size:11.5px;letter-spacing:2.2px;text-transform:uppercase;fill:#7f96b4;font-weight:600}
  .band-label .cn{letter-spacing:.5px;fill:#9fb4cf}
  /* 节点 */
  .node{cursor:pointer}
  .node .box{fill:#0d1524;stroke:#22334c;stroke-width:1.1;rx:11;transition:.14s}
  .node .accent{stroke:none}
  .node .t{font-size:13px;font-weight:640;fill:#e9f1fb;pointer-events:none}
  .node .s{font-size:10px;fill:#8298b5;pointer-events:none}
  .node:hover .box{stroke:#60a5fa;fill:#111d31}
  .node.sel .box{stroke:#93c5fd;stroke-width:2;fill:#132138}
  .node.hit .box{stroke:#fbbf24;stroke-width:1.8}
  .node.dim{opacity:.13}
  .node.off{opacity:.05;pointer-events:none}
  .node.sel .box,.node.hit .box{filter:drop-shadow(0 0 7px rgba(96,165,250,.5))}
  /* 边 */
  .edge{fill:none;stroke-width:1.25;opacity:.5;transition:.14s}
  .edge.k-flow{stroke:var(--flow)}
  .edge.k-async{stroke:var(--async);stroke-dasharray:5 4;opacity:.42}
  .edge.k-data{stroke:var(--data);stroke-dasharray:1.5 3.5;opacity:.4}
  .edge.k-db{stroke:var(--db);stroke-dasharray:6 4;opacity:.34}
  .edge.k-ext{stroke:var(--ext);stroke-dasharray:4 4;opacity:.34}
  .edge.hl{opacity:.95;stroke-width:2.1}
  .edge.dim{opacity:.05}
  .lbl{font-size:9.5px;fill:#9db3cf;opacity:0;pointer-events:none;paint-order:stroke;stroke:#060b13;stroke-width:3px;stroke-linejoin:round;transition:.2s}
  .lbl.on{opacity:.95}
  /* ── 详情抽屉 ───────────────────────────────────────── */
  .drawer{position:absolute;top:0;right:0;bottom:0;width:392px;max-width:46vw;overflow:auto;
    background:linear-gradient(180deg,rgba(9,15,26,.97),rgba(8,13,22,.97));
    border-left:1px solid var(--line);padding:16px 18px 40px;transform:translateX(100%);
    transition:transform .22s ease;z-index:4}
  .drawer.open{transform:none}
  .drawer h2{margin:4px 0 2px;font-size:16px;line-height:1.35}
  .drawer .bandtag{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.6px;
    padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:#b6c8de}
  .drawer .file{font:11px/1.5 ui-monospace,Consolas,monospace;color:#6f8fb3;word-break:break-all;margin:8px 0 10px}
  .drawer p{color:#c7d7ea;font-size:12.5px;margin:8px 0}
  .drawer h3{font-size:11px;letter-spacing:1.6px;color:#6d86a6;text-transform:uppercase;margin:16px 0 6px;font-weight:650}
  .sym{display:inline-block;font:10.5px/1.5 ui-monospace,Consolas,monospace;color:#9fd2ff;
    background:rgba(56,189,248,.08);border:1px solid rgba(56,189,248,.2);padding:1px 7px;border-radius:6px;margin:0 5px 5px 0}
  .nb{display:flex;flex-direction:column;gap:4px}
  .nb button{text-align:left;background:rgba(148,163,184,.06);border:1px solid var(--line);color:#cfdcee;
    padding:5px 9px;border-radius:7px;font-size:11.5px;cursor:pointer}
  .nb button:hover{border-color:#3b82f6;background:rgba(59,130,246,.12)}
  .hint{font-size:11.5px;color:#7b92ae;line-height:1.75}
  .hint kbd{font:10.5px/1 ui-monospace,Consolas,monospace;border:1px solid #2a3b52;border-bottom-width:2px;
    border-radius:5px;padding:1px 5px;background:#101a2b;color:#b7c9de}
  .close{position:absolute;top:12px;right:14px;border:none;background:none;color:#7b92ae;font-size:18px;cursor:pointer}
  .close:hover{color:#e6eefb}
  .foot{position:absolute;left:14px;bottom:11px;font-size:10.5px;color:#59718f;pointer-events:none}
  @media (max-width:860px){ .drawer{width:100%;max-width:none} input[type=search]{width:150px} }
</style>
</head>
<body>
<header>
  <div class="row1">
    <div class="brand"><h1>AIJiYi 全项目架构</h1><span class="ver">schema v11 · v0.8.3</span></div>
    <div class="stats" id="stats"></div>
    <div class="spacer"></div>
    <div class="tools">
      <input type="search" id="q" placeholder="搜索模块 / 文件 / 关键词  与 / 定位" aria-label="搜索">
      <button class="btn" id="mainpath" title="只高亮「一次对话」的主链路">主链路</button>
      <button class="btn" id="fit" title="适应窗口 (F)">适应</button>
      <button class="btn" id="zin" title="放大 (+)">+</button>
      <button class="btn" id="zout" title="缩小 (−)">−</button>
    </div>
  </div>
  <div class="row2">
    <div id="chips" style="display:flex;gap:6px;flex-wrap:wrap"></div>
    <div class="legend">
      <span><svg width="26" height="8"><line x1="0" y1="4" x2="26" y2="4" stroke="#7dd3fc" stroke-width="1.6"/></svg>调用</span>
      <span><svg width="26" height="8"><line x1="0" y1="4" x2="26" y2="4" stroke="#fbbf24" stroke-width="1.6" stroke-dasharray="4 3"/></svg>异步/队列</span>
      <span><svg width="26" height="8"><line x1="0" y1="4" x2="26" y2="4" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="1.5 3"/></svg>数据面</span>
      <span><svg width="26" height="8"><line x1="0" y1="4" x2="26" y2="4" stroke="#7c8ea8" stroke-width="1.6" stroke-dasharray="6 4"/></svg>落库</span>
      <span><svg width="26" height="8"><line x1="0" y1="4" x2="26" y2="4" stroke="#f472b6" stroke-width="1.6" stroke-dasharray="4 4"/></svg>外部</span>
    </div>
  </div>
</header>
<main>
  <svg id="stage" xmlns="http://www.w3.org/2000/svg"><defs id="defs"></defs><g id="viewport"></g></svg>
  <aside class="drawer" id="drawer"></aside>
  <div class="foot">滚轮缩放 · 拖拽平移 · 点节点看说明 · 数据来自 aiji/ 代码与 data/aiji.db 只读实测</div>
</main>

<script>
"use strict";
/* ══════════════════════════════════════════════════════════════
   1. 数据：9 个分层 + 68 个节点 + 边
   节点均对应真实文件/真实进程，说明文字来自模块 docstring、
   PROJECT_STATE.md 与 data/aiji.db 的只读统计（2026-11-02）。
   ══════════════════════════════════════════════════════════════ */
const BANDS = [
  {id:"entry",   name:"① 入口 / 客户端",  cn:"真实用户与外部程序",            color:"#38bdf8"},
  {id:"ingress", name:"② 接入层",          cn:"全部入口汇到一个 HTTP 核心",     color:"#22d3ee"},
  {id:"orch",    name:"③ 编排层",          cn:"一次对话怎么被组织出来",         color:"#a78bfa"},
  {id:"memory",  name:"④ 记忆核心",        cn:"写不丢 · 读有预算 · 注入不越权",  color:"#34d399"},
  {id:"life",    name:"⑤ 人格 / 生命",      cn:"状态、体检、主动与存在感",        color:"#fbbf24"},
  {id:"out",     name:"⑥ 出站 / 心脏",      cn:"从队列到真实送达",               color:"#f472b6"},
  {id:"tools",   name:"⑦ 工具 / 研究",      cn:"受控的动作与联网",               color:"#fb923c"},
  {id:"ops",     name:"⑧ 运维 / 控制台",    cn:"看得见、改得动、起停得住",        color:"#60a5fa"},
  {id:"data",    name:"⑨ 存储与外部依赖",   cn:"SQLite、素材、模型与账号",        color:"#94a3b8"}
];

const NODES = [
/* ── ① 入口 ── */
{id:"qq", band:"entry", t:"本机 QQ", s:"真实账号 · 保持登录", f:"（本机客户端）",
 d:"真实用户在这里：群聊与私聊。桌面/网页桌宠已按用户要求从当前代码移除（aiji/pet 只剩 .pyc，0 个 .py），相关描述只作为历史留在 PROJECT_STATE.md。",
 sym:["群聊","私聊"]},
{id:"napcat", band:"entry", t:"NapCat / OneBot 11", s:"6099 · 接管本机 QQ", f:"（外部进程）",
 d:"用 OneBot 11 协议把本机 QQ 暴露出来。6099 端口在听表示注入层已就绪；它是「启动与结束」页依赖链的第一环。",
 sym:["6099","OneBot 11"]},
{id:"astrbot", band:"entry", t:"AstrBot", s:"6185 · 消息宿主 / 插件", f:"（外部进程）",
 d:"消息处理与插件宿主，AIJiYi 的回复都经它送出。它的 OneBot 服务端在 6199，只有 QQ 登录并连上后才会出现 ESTABLISHED。",
 sym:["6185","6199"]},
{id:"openai_cli", band:"entry", t:"任意 OpenAI 客户端", s:"IDE / IM 网关 / 自建前端", f:"（外部）",
 d:"填 http://127.0.0.1:8787/v1 就是一次接入：/v1/models 做模型发现，/v1/chat/completions 支持普通 JSON 与 SSE 流式。桌宠、IDE、IM 网关不必各写一套。",
 sym:["/v1/models","/v1/chat/completions","SSE"]},
{id:"console", band:"entry", t:"浏览器控制台", s:"127.0.0.1:8787/", f:"aiji/web/operations.html",
 d:"4 个主入口：运行总览 / 全部功能 / 功能配置 / 启动与结束。页面状态全部来自实时接口，不使用演示数据；CORS 只放行 null 与本机 8787。",
 sym:["overview","features","settings","lifecycle"]},
{id:"cli", band:"entry", t:"aiji CLI", s:"17 个子命令", f:"aiji/cli.py",
 d:"serve / remember / recall / ingest / inject / feedback / style / media / accounts / stats / doctor / export / bench / forget / archive / self-memory / quota。",
 sym:["doctor","forget","archive","quota"]},
{id:"octop", band:"entry", t:"Octop Gateway", s:"另一条网关适配", f:"aiji/bridge/octop_gateway.py",
 d:"把网关消息翻译成 AIJiYi 的 inbound payload，再走同一个 HTTP 核心；不复制记忆逻辑。",
 sym:["inbound_payload"]},

/* ── ② 接入层 ── */
{id:"server", band:"ingress", t:"HTTP 服务", s:"REST + OpenAI 兼容 + 控制台", f:"aiji/server.py",
 d:"所有入口汇到这一个 ThreadingHTTPServer：身份三字段 (platform, platform_user_id, scope) 解析、API Key 鉴权（HMAC 比较）、CORS 白名单、SSE、/media 只回引用不回字节。探测记录 61 条路由全可达（2026-11-01）。",
 sym:["AijiHTTPServer","_Handler","make_server","parse_identity_hint"]},
{id:"onebot", band:"ingress", t:"OneBot 桥", s:"收事件 + 主动调 action", f:"aiji/bridge/onebot.py",
 d:"parse_event 把 OneBot 事件标准化成 Envelope；OneBotClient / OneBotBridge 负责发送、取头像、拉媒体。群里不带 @ 的消息也会入库（只学不抢话）。",
 sym:["parse_event","OneBotClient","OneBotBridge"]},
{id:"octopb", band:"ingress", t:"网关桥", s:"inbound → 标准请求", f:"aiji/bridge/octop_gateway.py",
 d:"AijiGatewayClient 把网关侧的消息换成 AIJiYi 请求；进程内直接跑，省一次网络往返。",
 sym:["AijiGatewayClient","make_processor"]},
{id:"clib", band:"ingress", t:"CLI 入口", s:"argparse · 单进程", f:"aiji/cli.py",
 d:"命令行是「不装服务也能用」的入口：直接打开同一个 Memory 门面，落同一个库。doctor 会告诉你缺哪把 key、哪条路由在场。",
 sym:["_memory","_ident","cmd_serve"]},
{id:"netguard", band:"ingress", t:"URL 护栏", s:"公网校验 / 防私网", f:"aiji/net_guard.py",
 d:"所有用户可控的抓取（点歌、表情包更新、MCP 研究）先过这里：只允许公网 http(s)，解析到私网/回环直接拒——防 SSRF。",
 sym:["validate_public_http_url","UrlGuardError"]},

/* ── ③ 编排层 ── */
{id:"head", band:"orch", t:"对话头", s:"Head.reply() · 无状态", f:"aiji/head.py",
 d:"一次对话的编排器：归一化消息 → 召回并注入记忆 → 角色边界与人格约束 → 模型池 → 出口闸门 → 拟人节奏 → 返回。不持有会话状态，也不绑定任何平台。",
 sym:["HeadReply","Head.reply","normalize_messages"]},
{id:"debounce", band:"orch", t:"连发合并", s:"800ms 窗口", f:"aiji/debounce.py",
 d:"同会话连发短句并成一次模型调用（Settings.debounce_ms）。没有它，用户打三行字就是三次模型调用、三条记忆。",
 sym:["ConversationDebouncer","merge_messages"]},
{id:"pool", band:"orch", t:"模型池", s:"6 条默认路由 · 冷却 + 故障转移", f:"aiji/pool.py",
 d:"轮转、冷却、故障转移。本机两个积分制反代（workbuddy 8788、agent2api 3065）已实测连通，LLM 第二层/模型抽取/摘要/软嵌入全部真机验证过；公网免费池只在本地假 OpenAI 服务上验过。PoolExhausted 立即落规则兜底，写入不丢。",
 sym:["ModelPool","PoolExhausted","PoolResult"]},
{id:"gate", band:"orch", t:"出口闸门", s:"人格 / 物理底线", f:"aiji/gate.py",
 d:"sanitize_reply + check_reply：越权、身份泄露、可执行代码在出门前被拦；拦完给一套体面的替代说法，而不是报错。",
 sym:["sanitize_reply","check_reply","GateResult"]},
{id:"humanize", band:"orch", t:"拟人节奏", s:"首字延迟 + 打字停顿", f:"aiji/humanize.py",
 d:"只给外部 IM 加延迟（IM_PLATFORMS 白名单）；对 API 调用者不加任何人为等待。",
 sym:["HumanPacer","IM_PLATFORMS"]},
{id:"role", band:"orch", t:"角色边界", s:"IM 禁代码 / 禁物理动作", f:"aiji/role_boundary.py",
 d:"IM 角色空间里不许输出可运行代码、不许声称自己执行了物理动作；桌面平台保留工具能力。身份被追问时走 identity_repair。",
 sym:["prompt_block","refusal","identity_repair"]},
{id:"persona", band:"orch", t:"人格底色", s:"风格块 + few-shot", f:"aiji/persona.py",
 d:"只提供说话风格（learned_examples / style_block / few_shot），不覆盖物理底线，也不覆盖记忆事实；素材在 data/persona/*.json。",
 sym:["style_block","few_shot","reminder"]},
{id:"selfhood", band:"orch", t:"自我底线", s:"不可动摇 + 可被推翻", f:"aiji/selfhood.py",
 d:"物理底线是硬的（floor_text，assert_floor_clean 防自强化）；性格是涌出的，能被证据推翻。两者分开写，才不会互相污染。",
 sym:["floor_text","assert_floor_clean","system_prefix"]},
{id:"quota", band:"orch", t:"主动配额", s:"反代积分 ÷ 单条单价", f:"aiji/quota.py",
 d:"allowed_24h = min(8, floor(剩余积分 × 0.8 ÷ 单条单价))。余额四个来源：配置 URL → 响应头 → data/credits.json → 静态/环境变量。两个反代都不吐余额，所以留了 aiji quota --set N 手填，并显示「填了多久」。",
 sym:["QuotaState","CreditProvider","parse_credits"]},

/* ── ④ 记忆核心 ── */
{id:"memory", band:"memory", t:"Memory 门面", s:"三层存储 + 一个闭环", f:"aiji/memory.py",
 d:"turn / remember / ingest / exchange 写；recall 100ms 预算读；inject 出软引导块；feedback 回写命中与留痕。全部按 (platform, platform_user_id, scope) 隔离，跨平台串号是这里防的。",
 sym:["Memory.open","exchange","inject","feedback"]},
{id:"recognize", band:"memory", t:"识别层", s:"任意输入 → Envelope", f:"aiji/recognize.py",
 d:"把任意输入降维成 (text, meta, confidence, status)，之后与纯文本走同一条反思管线，不按类型分叉。缺引擎时如实 unsupported，不编造文本。",
 sym:["Envelope","Item","Recognizers"]},
{id:"engines", band:"memory", t:"OCR · ASR 适配", s:"RapidOCR · FunASR · whisper", f:"aiji/real_engines.py",
 d:"RapidOCR 做图，FunASR paraformer-zh 做中文语音（14/14），faster-whisper tiny 回退。识别超时 45s（真引擎 2~10s 起）。",
 sym:["ocr_image","transcribe_wav_bytes","set_asr_model"]},
{id:"audio", band:"memory", t:"媒体音频", s:"URL → bytes → WAV", f:"aiji/media_audio.py",
 d:"用户给的媒体 URL 下载后 ffmpeg 归一到 16k WAV 再进 ASR；下载前过 net_guard。图片走 bytes 分支——历史上只吃 url 导致生产 OCR 100% 空产出。",
 sym:["media_bytes_from_url","transcribe_item_audio"]},
{id:"extract", band:"memory", t:"抽取层", s:"事实/知识/关系/画像/风格/摘要", f:"aiji/extract.py",
 d:"模型抽取为主、启发式兜底；带 artifact 过滤、口癖词表、注入文本识别——防止把自己的注入块当成用户事实再学一遍。",

NODES.forEach(n=>{ (bandOf[n.band]||BANDS[0]).nodes.push(n); });
const maxN = Math.max(...BANDS.map(b=>b.nodes.length));
const CONTENT_W = maxN*COL_W + (maxN-1)*GAP;
const W = CONTENT_W + PAD*2 + LANE;

const pos = {};
let y = 44;
BANDS.forEach(b=>{
  const n = b.nodes.length;
  const width = n*COL_W + (n-1)*GAP;
  let x = PAD + (CONTENT_W - width)/2;
  b.y = y; b.h = NODE_H;
  b.nodes.forEach(nd=>{
    pos[nd.id] = {x, y, w:COL_W, h:NODE_H, cx:x+COL_W/2, cy:y+NODE_H/2};
    nd._band = b;
    x += COL_W + GAP;
  });
  y += NODE_H + BAND_GAP;
});
const H = y + 30;
const LANE_X = W - 40;

/* ══════════════════════════════════════════════════════════════
   3. 渲染
   ══════════════════════════════════════════════════════════════ */
function el(tag, attrs, parent){
  const e = document.createElementNS(NS, tag);
  for(const k in attrs) if(attrs[k]!==undefined && attrs[k]!==null) e.setAttribute(k, attrs[k]);
  if(parent) parent.appendChild(e);
  return e;
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* 箭头 */
const defs = document.getElementById("defs");
const KINDS = {flow:"#7dd3fc", async:"#fbbf24", data:"#94a3b8", db:"#7c8ea8", ext:"#f472b6"};
Object.entries(KINDS).forEach(([k,c])=>{
  const m = el("marker", {id:"arw-"+k, viewBox:"0 0 10 10", refX:9, refY:5,
    markerWidth:6, markerHeight:6, orient:"auto-start-reverse"}, defs);
  el("path", {d:"M0,0 L10,5 L0,10 z", fill:c, opacity:.85}, m);
});

const gBands = el("g", {class:"bands"}, VP);
const gEdges = el("g", {class:"edges"}, VP);
const gLabels = el("g", {class:"labels"}, VP);
const gNodes = el("g", {class:"nodes"}, VP);

/* 分层背景 + 标题 */
BANDS.forEach(b=>{
  el("rect", {class:"band-bg", x:PAD-18, y:b.y-34, width:CONTENT_W+36, height:NODE_H+50, rx:14,
    fill:b.color, "fill-opacity":.045, stroke:b.color, "stroke-opacity":.16}, gBands);
  const lab = el("text", {class:"band-label", x:PAD-16, y:b.y-15, fill:b.color, "fill-opacity":.8}, gBands);
  lab.textContent = b.name;
  const cn = el("tspan", {class:"cn", dx:10, fill:"#8ea3bf", "fill-opacity":.75}, lab);
  cn.textContent = b.cn;
});

/* 节点 */
const nodeEl = {}, edgeEl = {};
NODES.forEach(nd=>{
  const p = pos[nd.id], b = nd._band;
  const g = el("g", {class:"node", "data-id":nd.id, transform:`translate(${p.x},${p.y})`}, gNodes);
  el("rect", {class:"box", x:0, y:0, width:COL_W, height:NODE_H, rx:11}, g);
  el("rect", {class:"accent", x:0, y:8, width:3.5, height:NODE_H-16, rx:2, fill:b.color, opacity:.75}, g);
  const t = el("text", {class:"t", x:15, y:27}, g); t.textContent = nd.t;
  const s = el("text", {class:"s", x:15, y:45}, g); s.textContent = nd.s;
  g.addEventListener("click", ev=>{ ev.stopPropagation(); pin(nd.id); });
  g.addEventListener("mouseenter", ()=>{ hoverId = nd.id; apply(); });
  g.addEventListener("mouseleave", ()=>{ hoverId = null; apply(); });
  nodeEl[nd.id] = g;
});

/* 边 */
function pathFor(e){
  const a = pos[e.a], b = pos[e.b];
  if(!a || !b) return null;
  if(e.k === "db"){                                  /* 走右侧存储总线 */
    const sx = a.x + a.w, sy = a.y + a.h/2;
    const ty = b.y + b.h/2;
    return {d:`M${sx},${sy} L${LANE_X},${sy} L${LANE_X},${ty} L${b.x+b.w},${ty}`,
            x:(LANE_X + b.x + b.w)/2, y:ty-6};
  }
  if(e.a === e.b) return null;
  const sameBand = Math.abs(a.y - b.y) < 1;
  if(sameBand){
    if(b.x > a.x){
      const x1=a.x+a.w, y1=a.y+a.h/2, x2=b.x, y2=b.y+b.h/2;
      return {d:`M${x1},${y1} C${x1+30},${y1} ${x2-30},${y2} ${x2},${y2}`, x:(x1+x2)/2, y:y1-7};
    }
    const dip = a.y + a.h + 30;
    const x1=a.x+a.w/2, x2=b.x+b.w/2;
    return {d:`M${x1},${a.y+a.h} C${x1},${dip} ${x2},${dip} ${x2},${b.y+b.h}`, x:(x1+x2)/2, y:dip};
  }
  if(b.y > a.y){
    const x1=a.x+a.w/2, y1=a.y+a.h, x2=b.x+b.w/2, y2=b.y;
    const dy = Math.max(26, (y2-y1)*0.48);
    return {d:`M${x1},${y1} C${x1},${y1+dy} ${x2},${y2-dy} ${x2},${y2}`,
            x:(x1+x2)/2, y:(y1+y2)/2};
  }
  const x1=a.x+a.w/2, y1=a.y, x2=b.x+b.w/2, y2=b.y+b.h;
  const dy = Math.max(30, (y1-y2)*0.45);
  return {d:`M${x1},${y1} C${x1},${y1-dy} ${x2},${y2+dy} ${x2},${y2}`,
          x:(x1+x2)/2, y:(y1+y2)/2};
}

const adj = {}; NODES.forEach(n=>{ adj[n.id] = new Set(); });
EDGES.forEach((e,idx)=>{
  const p = pathFor(e);
  if(!p) return;
  const path = el("path", {class:"edge k-"+e.k, d:p.d, "marker-end":`url(#arw-${e.k})`}, gEdges);
  edgeEl[idx] = path;
  if(e.l){
    const lab = el("text", {class:"lbl", x:p.x, y:p.y, "text-anchor":"middle"}, gLabels);
    lab.textContent = e.l; e._lab = lab;
  }
  adj[e.a] && adj[e.a].add(e.b);
  adj[e.b] && adj[e.b].add(e.a);
});

/* ══════════════════════════════════════════════════════════════
   4. 视图变换（缩放 / 平移）
   ══════════════════════════════════════════════════════════════ */
let k = 1, tx = 0, ty = 0;
const view = {k:1, tx:0, ty:0, min:.22, max:2.4};

function applyView(){
  VP.setAttribute("transform", `matrix(${view.k},0,0,${view.k},${view.tx},${view.ty})`);
}
/* 可用宽度：抽屉打开时，画布不该被它盖住 */
function availW(){
  const r = SVG.getBoundingClientRect();
  const d = drawer.classList.contains("open") ? Math.min(392, r.width*0.46) : 0;
  return r.width - d;
}
function fit(){
  const r = SVG.getBoundingClientRect();
  const aw = availW();
  const kk = Math.min((aw-30)/W, (r.height-30)/H);
  view.k = Math.max(view.min, Math.min(view.max, kk));
  view.tx = (aw - W*view.k)/2;
  view.ty = (r.height - H*view.k)/2;
  applyView();
}
function zoomAt(factor, cx, cy){
  const r = SVG.getBoundingClientRect();
  const px = (cx ?? availW()/2), py = (cy ?? SVG.getBoundingClientRect().height/2);
  const nk = Math.max(view.min, Math.min(view.max, view.k*factor));
  const ratio = nk/view.k;
  view.tx = px - (px - view.tx)*ratio;
  view.ty = py - (py - view.ty)*ratio;
  view.k = nk;
  applyView();
}
SVG.addEventListener("wheel", ev=>{
  ev.preventDefault();
  const r = SVG.getBoundingClientRect();
  zoomAt(Math.pow(1.0016, -ev.deltaY), ev.clientX-r.left, ev.clientY-r.top);
  applyLabels();
}, {passive:false});

let drag = null;
SVG.addEventListener("pointerdown", ev=>{
  if(ev.button !== 0) return;
  drag = {x:ev.clientX, y:ev.clientY, tx:view.tx, ty:view.ty, moved:false};
  SVG.classList.add("dragging");
  SVG.setPointerCapture(ev.pointerId);
});
SVG.addEventListener("pointermove", ev=>{
  if(!drag) return;
  const dx = ev.clientX-drag.x, dy = ev.clientY-drag.y;
  if(Math.abs(dx)+Math.abs(dy) > 3) drag.moved = true;
  view.tx = drag.tx + dx; view.ty = drag.ty + dy;
  applyView();
});
function endDrag(ev){
  if(!drag) return;
  const moved = drag.moved;
  drag = null;
  SVG.classList.remove("dragging");
  try{ SVG.releasePointerCapture(ev.pointerId); }catch(_){}
  if(!moved) pin(null);
}
SVG.addEventListener("pointerup", endDrag);
SVG.addEventListener("pointercancel", endDrag);

/* ══════════════════════════════════════════════════════════════
   5. 高亮 / 搜索 / 分层开关
   ══════════════════════════════════════════════════════════════ */
let hoverId = null, pinned = null, mainMode = false, query = "";
const offBands = new Set();
const drawer = document.getElementById("drawer");

function matches(nd, q){
  if(!q) return true;
  const hay = [nd.t, nd.s, nd.f, nd.d, nd.band, (nd.sym||[]).join(" ")].join(" ").toLowerCase();
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(w=>hay.includes(w));
}
function apply(){
  const q = query.trim();
  const hits = q ? new Set(NODES.filter(n=>matches(n,q)).map(n=>n.id)) : null;
  const active = pinned || hoverId;
  const hood = active ? new Set([active, ...(adj[active]||[])]) : null;

  NODES.forEach(nd=>{
    const g = nodeEl[nd.id];
    const off = offBands.has(nd.band);
    g.classList.toggle("off", off);
    const dim = off ||
      (mainMode && !MAIN.has(nd.id)) ||
      (hits && !hits.has(nd.id)) ||
      (hood && !hood.has(nd.id));
    g.classList.toggle("dim", !!dim && !off);
    g.classList.toggle("sel", pinned === nd.id);
    g.classList.toggle("hit", !!(hits && hits.has(nd.id) && !dim));
  });

  EDGES.forEach((e,idx)=>{
    const g = edgeEl[idx]; if(!g) return;
    const off = offBands.has(e.a) || offBands.has(e.b);
    const hl = !!active && (e.a === active || e.b === active);
    const dim = off ||
      (mainMode && !(MAIN.has(e.a) && MAIN.has(e.b))) ||
      (hits && !(hits.has(e.a) && hits.has(e.b))) ||
      (hood && !hl);
    g.classList.toggle("hl", hl && !dim);
    g.classList.toggle("dim", !!dim);
    if(e._lab){
      const on = (hl && !dim) || (q && !dim) || (!dim && view.k > 1.25);
      e._lab.classList.toggle("on", !!on);
    }
  });
  applyLabels();
  if(pinned) showDetail(pinned);
}
function applyLabels(){ /* 缩放后按需显示边标签 */
  EDGES.forEach(e=>{
    if(!e._lab) return;
    const dim = e._lab.classList.contains("on");
    if(!dim && view.k > 1.25 && !e._lab.classList.contains("dim")) e._lab.classList.add("on");
  });
}

/* 分层开关 */
const chips = document.getElementById("chips");
BANDS.forEach(b=>{
  const c = document.createElement("div");
  c.className = "chip"; c.dataset.band = b.id;
  c.innerHTML = `<i style="background:${b.color}"></i>${esc(b.name.replace(/^[①②③④⑤⑥⑦⑧⑨]\s*/,""))}`;
  c.title = b.cn + " · 点击隐藏/显示";
  c.onclick = ()=>{
    if(offBands.has(b.id)) offBands.delete(b.id); else offBands.add(b.id);
    c.classList.toggle("off", offBands.has(b.id));
    apply();
  };
  chips.appendChild(c);
});

/* 搜索 */
const qInput = document.getElementById("q");
qInput.addEventListener("input", ()=>{ query = qInput.value; apply(); });
qInput.addEventListener("keydown", ev=>{
  if(ev.key === "Escape"){ qInput.value = ""; query = ""; apply(); qInput.blur(); }
});

/* 主链路开关 */
const mainBtn = document.getElementById("mainpath");
mainBtn.onclick = ()=>{ mainMode = !mainMode; mainBtn.classList.toggle("on", mainMode); apply(); };

/* 详情 */
function neighborsOf(id){ return [...(adj[id]||[])].sort(); }
function showDetail(id){
  const nd = NODES.find(n=>n.id === id); if(!nd) return;
  const b = nd._band;
  const nbs = neighborsOf(id).map(nid=>{
    const n = NODES.find(x=>x.id === nid);
    return n ? `<button data-go="${n.id}">${esc(n.t)} <span style="color:#6f8fb3">· ${esc(n.s)}</span></button>` : "";
  }).join("");
  drawer.innerHTML = `
    <button class="close" id="dclose" aria-label="关闭">×</button>
    <div class="bandtag"><i style="width:7px;height:7px;border-radius:2px;background:${b.color};display:inline-block"></i>${esc(b.name)}</div>
    <h2>${esc(nd.t)}</h2>
    <div style="color:#8ea3bf;font-size:12px">${esc(nd.s)}</div>
    <div class="file">${esc(nd.f)}</div>
    <p>${esc(nd.d)}</p>
    ${ (nd.sym&&nd.sym.length) ? `<h3>关键符号</h3><div>${nd.sym.map(s=>`<span class="sym">${esc(s)}</span>`).join("")}</div>` : "" }
    <h3>相连 ${neighborsOf(id).length} 处</h3>
    <div class="nb">${nbs || '<span class="hint">没有连线。</span>'}</div>
    <h3>相关的落盘证据</h3>
    <div class="hint">
      代码位置：<kbd>${esc(nd.f)}</kbd><br>
      数据库：<kbd>data/aiji.db</kbd> · schema v11 · 24 张业务表<br>
      项目档案：<kbd>docs/agent/PROJECT_STATE.md</kbd>
    </div>`;
  drawer.classList.add("open");
  drawer.querySelectorAll("[data-go]").forEach(btn=>{
    btn.onclick = ()=>{ pin(btn.dataset.go); };
  });
  drawer.querySelector("#dclose").onclick = ()=>{ pin(null); };
}
function overview(){
  const cn = NODES.length, en = EDGES.length;
  drawer.innerHTML = `
    <button class="close" id="dclose" aria-label="关闭">×</button>
    <div class="bandtag">怎么读这张图</div>
    <h2>AIJiYi：记忆 + 人格中间件</h2>
    <p>自上而下是请求的方向：<b>入口</b> → <b>接入</b> → <b>编排</b> → <b>记忆核心</b>；左边是「谁在说话」，右下是「存在了哪里」。</p>
    <p>全图 ${cn} 个节点、${en} 条连线，覆盖 <b>aiji/ 下 55 个 .py 模块</b>、控制台前端、6 个外部进程与本地模型。</p>
    <h3>三个抓手</h3>
    <div class="hint">
      ① <b>一次对话</b>：QQ → NapCat → AstrBot → <kbd>/v1/chat/completions</kbd> → 对话头 → 召回/注入 → 模型池 → 出口闸门 → 心脏层 → OneBot 发送。<br>
      ② <b>一次沉淀</b>：入队 µs 级 → 识别 → 抽取（事实/知识/关系/画像/风格/摘要）→ 冲突消解 → SQLite；全过程不阻塞主链路。<br>
      ③ <b>一次代谢</b>：读→强化、冻结、归档、淘汰；由 janitor 低频 + 水位触发。
    </div>
    <h3>关键数字（只读实测）</h3>
    <div class="hint">
      事实 21,365 · 轮次 24,817 · 归档 13,719 · 注入 1,512 · 事实日志 23,469<br>
      heart / outbox / send_queue / write_queue：<b>全 0 行</b>（发送实际由 AstrBot 插件完成）
    </div>
    <h3>操作</h3>
    <div class="hint">
      滚轮缩放、拖拽平移；点节点看说明与相邻关系；<kbd>F</kbd> 适应窗口、<kbd>+</kbd>/<kbd>−</kbd> 缩放、<kbd>Esc</kbd> 取消选中、<kbd>/</kbd> 搜索。<br>
      顶部「主链路」只高亮一次真实对话的路径；点分层胶囊可以单独隐藏一层。
    </div>`;
  drawer.classList.add("open");
  drawer.querySelector("#dclose").onclick = ()=>{ drawer.classList.remove("open"); };
}
function readHash(){
  const h = decodeURIComponent((location.hash || "").slice(1));
  return NODES.some(n=>n.id === h) ? h : null;
}
function pin(id, opts){
  pinned = id;
  if(id) showDetail(id); else if(drawer.classList.contains("open")) overview();
  apply();
  if(!(opts && opts.silent)){
    try{ history.replaceState(null, "", location.pathname + location.search + (id ? "#"+id : "")); }catch(_){}
  }
}
window.addEventListener("hashchange", ()=>{
  const h = readHash();
  if(h !== pinned) pin(h, {silent:true});
});

/* 顶栏统计 */
const statsEl = document.getElementById("stats");
[
  ["aiji/ 模块", "55"], ["schema", "v11"], ["业务表", "24"],
  ["单测", "478"], ["测试文件", "43"], ["bench", "9"]
].forEach(([a,b])=>{
  const d = document.createElement("div");
  d.className = "stat"; d.innerHTML = `${a} <b>${b}</b>`;
  statsEl.appendChild(d);
});

document.getElementById("fit").onclick = ()=>fit();
document.getElementById("zin").onclick = ()=>zoomAt(1.22);
document.getElementById("zout").onclick = ()=>zoomAt(1/1.22);

document.addEventListener("keydown", ev=>{
  const inField = /input|textarea/i.test(ev.target.tagName);
  if(ev.key === "Escape"){
    if(query){ qInput.value=""; query=""; apply(); }
    else { pinned = null; drawer.classList.remove("open"); apply(); }
    return;
  }
  if(inField) return;
  if(ev.key === "/"){ ev.preventDefault(); qInput.focus(); }
  else if(ev.key === "f" || ev.key === "F"){ fit(); }
  else if(ev.key === "0"){ view.k=1; view.tx=0; view.ty=0; applyView(); }
  else if(ev.key === "+" || ev.key === "="){ zoomAt(1.22); }
  else if(ev.key === "-" || ev.key === "_"){ zoomAt(1/1.22); }
});

/* 启动 */
applyView();
fit();
apply();
if(readHash()) pin(readHash(), {silent:true}); else overview();
window.addEventListener("resize", ()=>{ /* 保持用户视角，不强制 reset */ });
</script>
</body>
</html>
