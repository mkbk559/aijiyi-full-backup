<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIJiYi 人体架构 · 儿童行为</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23070c15'/%3E%3Ccircle cx='32' cy='24' r='9' fill='%237dd3fc'/%3E%3Cpath d='M18 46 Q18 34 32 34 Q46 34 46 46 L46 50 L18 50 Z' fill='%23a78bfa'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#070c15; --line:#1c2a41; --txt:#e6eefb; --sub:#8ea3bf;
    --flow:#7dd3fc; --async:#fbbf24; --data:#94a3b8; --db:#7c8ea8; --ext:#f472b6;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:radial-gradient(1200px 700px at 18% -10%,#12203a 0%,transparent 60%),
               radial-gradient(900px 600px at 100% 0%,#101a2e 0%,transparent 55%),var(--bg);
    color:var(--txt);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
    display:flex;flex-direction:column;overflow:hidden;
  }
  /* ── 顶栏 ───────────────────────────────────────────── */
  header{flex:0 0 auto;padding:12px 18px 10px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,rgba(11,18,32,.96),rgba(11,18,32,.72));backdrop-filter:blur(8px);z-index:5}
  .row1{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .brand{display:flex;align-items:baseline;gap:10px}
  .brand h1{margin:0;font-size:17px;letter-spacing:.3px;font-weight:650}
  .brand .ver{font:11px/1 ui-monospace,SFMono-Regular,Consolas,monospace;color:#5b7a9e}
  .stats{display:flex;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--sub)}
  .stat{padding:2px 8px;border:1px solid var(--line);border-radius:999px;background:rgba(148,163,184,.06);white-space:nowrap}
  .stat b{color:#cfe3ff;font-weight:600}
  .spacer{flex:1 1 auto}
  .tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .btn{border:1px solid var(--line);background:rgba(148,163,184,.07);color:var(--txt);
    padding:6px 11px;border-radius:8px;font-size:12px;cursor:pointer;transition:.15s}
  .btn:hover{background:rgba(125,211,252,.14);border-color:#2a4a6b}
  .btn.on{background:rgba(125,211,252,.2);border-color:#3b82f6;color:#eaf6ff}
  input[type=search]{width:230px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);
    background:rgba(4,9,17,.75);color:var(--txt);font-size:12px;outline:none}
  input[type=search]:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.16)}
  .row2{display:flex;gap:10px;margin-top:9px;align-items:center;flex-wrap:wrap}
  #behaviorHint{font-size:11.5px;color:#c3d3e8;background:rgba(125,211,252,.08);border:1px solid rgba(125,211,252,.18);
    padding:4px 11px;border-radius:8px;max-width:640px;line-height:1.5}
  #behaviorHint b{color:#eaf6ff}
  #chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:11px;
    border:1px solid var(--line);cursor:pointer;user-select:none;color:#c3d3e8;background:rgba(148,163,184,.05)}
  .chip i{width:7px;height:7px;border-radius:2px;display:inline-block}
  .chip.off{opacity:.38;text-decoration:line-through}
  .legend{display:flex;gap:12px;font-size:11px;color:var(--sub);margin-left:auto;align-items:center;flex-wrap:wrap}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .legend svg{overflow:visible}
  /* ── 画布 ───────────────────────────────────────────── */
  main{position:relative;flex:1 1 auto;overflow:hidden}
  #stage{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
  #stage.dragging{cursor:grabbing}
  /* 人体轮廓（装饰层） */
  .body-out{fill:rgba(148,183,220,.05);stroke:rgba(148,183,220,.17);stroke-width:1.2}
  .body-limb{fill:none;stroke:rgba(148,183,220,.12);stroke-linecap:round}
  .deco-line{fill:none;stroke:rgba(148,183,220,.14);stroke-width:1}
  .deco-text{font-size:9px;fill:rgba(148,183,220,.5)}
  /* 眼睛 */
  .eye-white{fill:rgba(148,183,220,.22);stroke:rgba(148,183,220,.3);stroke-width:.8}
  .pupil{fill:#8fd4ff}
  .pupil-glint{fill:#f4fbff}
  /* 器官光晕 */
  .band-bg{fill:rgba(148,163,184,.045);stroke:rgba(148,163,184,.15);stroke-dasharray:3 6}
  .band-arm{fill:none;stroke-linecap:round;stroke-dasharray:3 6}
  .band-label{font-size:11px;font-weight:600;letter-spacing:.5px}
  /* 节点 */
  .node{cursor:pointer}
  .node .box{fill:#0d1524;stroke:#22334c;stroke-width:1.1;rx:11;transition:.14s}
  .node .accent{stroke:none}
  .node .t{font-size:13px;font-weight:640;fill:#e9f1fb;pointer-events:none}
  .node .s{font-size:10px;fill:#8298b5;pointer-events:none}
  .node:hover .box{stroke:#60a5fa;fill:#111d31}
  .node.sel .box{stroke:#93c5fd;stroke-width:2;fill:#132138}
  .node.hit .box{stroke:#fbbf24;stroke-width:1.8}
  .node.dim{opacity:.13}
  .node.off{opacity:.05;pointer-events:none}
  .node.sel .box,.node.hit .box{filter:drop-shadow(0 0 7px rgba(96,165,250,.5))}
  /* 边 */
  .edge{fill:none;stroke-width:1.25;opacity:.5;transition:.14s}
  .edge.k-flow{stroke:var(--flow)}
  .edge.k-async{stroke:var(--async);stroke-dasharray:5 4;opacity:.42}
  .edge.k-data{stroke:var(--data);stroke-dasharray:1.5 3.5;opacity:.4}
  .edge.k-db{stroke:var(--db);stroke-dasharray:6 4;opacity:.34}
  .edge.k-ext{stroke:var(--ext);stroke-dasharray:4 4;opacity:.34}
  .edge.hl{opacity:.95;stroke-width:2.1}
  .edge.dim{opacity:.05}
  .lbl{font-size:9.5px;fill:#9db3cf;opacity:0;pointer-events:none;paint-order:stroke;stroke:#060b13;stroke-width:3px;stroke-linejoin:round;transition:.2s}
  .lbl.on{opacity:.95}
  /* ── 儿童行为动画（持续、克制） ─────────────────────── */
  .anim{transform-box:fill-box;transform-origin:center}
  /* 眨眼：大部分时间睁开，快速闭上 */
  @keyframes blink{ 0%,91%,100%{transform:scaleY(1)} 94%,97%{transform:scaleY(.08)} }
  .eye-group{animation:blink 4.4s infinite}
  /* 呼吸：儿童更快，约 2.6s */
  @keyframes breathe{ 0%,100%{transform:scaleY(.975)} 50%{transform:scaleY(1.022)} }
  .chest-anim{animation:breathe 2.6s ease-in-out infinite}
  /* 心跳：儿童更快，约 1.1s，两次快速跳动 */
  @keyframes heartbeat{
    0%,100%{transform:scale(1)} 14%{transform:scale(1.13)} 28%{transform:scale(1)}
    42%{transform:scale(1.08)} 56%{transform:scale(1)}
  }
  .heart-anim{animation:heartbeat 1.1s ease-in-out infinite}
  /* 身体轻微摇摆（活泼） */
  @keyframes sway{
    0%,100%{transform:translateY(-3px) rotate(-.32deg)}
    50%{transform:translateY(3px) rotate(.32deg)}
  }
  #bodySway{transform-box:fill-box;transform-origin:50% 55%;animation:sway 5.4s ease-in-out infinite}
  /* 点击节点时的活泼弹跳 */
  @keyframes bounceK{ 0%{transform:translateY(0)} 38%{transform:translateY(-11px)} 100%{transform:translateY(0)} }
  gBody.bounce{animation:bounceK .46s ease}
  /* ── 详情抽屉 ───────────────────────────────────────── */
  .drawer{position:absolute;top:0;right:0;bottom:0;width:392px;max-width:46vw;overflow:auto;
    background:linear-gradient(180deg,rgba(9,15,26,.97),rgba(8,13,22,.97));
    border-left:1px solid var(--line);padding:16px 18px 40px;transform:translateX(100%);
    transition:transform .22s ease;z-index:4}
  .drawer.open{transform:none}
  .drawer h2{margin:4px 0 2px;font-size:16px;line-height:1.35}
  .drawer .bandtag{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.6px;
    padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:#b6c8de}
  .drawer .file{font:11px/1.5 ui-monospace,Consolas,monospace;color:#6f8fb3;word-break:break-all;margin:8px 0 10px}
  .drawer p{color:#c7d7ea;font-size:12.5px;margin:8px 0}
  .drawer h3{font-size:11px;letter-spacing:1.6px;color:#6d86a6;text-transform:uppercase;margin:16px 0 6px;font-weight:650}
  .sym{display:inline-block;font:10.5px/1.5 ui-monospace,Consolas,monospace;color:#9fd2ff;
    background:rgba(56,189,248,.08);border:1px solid rgba(56,189,248,.2);padding:1px 7px;border-radius:6px;margin:0 5px 5px 0}
  .pri{display:inline-block;font:9.5px/1.4 ui-monospace,Consolas,monospace;padding:0 5px;border-radius:5px;margin-right:6px;font-weight:700;vertical-align:1px}
  .pri0{color:#f9a8d4;background:rgba(244,114,182,.12);border:1px solid rgba(244,114,182,.32)}
  .pri1{color:#fcd34d;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.32)}
  .pri2{color:#93c5fd;background:rgba(96,165,250,.12);border:1px solid rgba(96,165,250,.32)}
  .rm-node{color:#8fd4ff;font-size:11px;font-weight:650}
  .rm-item{margin:6px 0;padding-left:2px}
  .rm-lim{color:#c7d7ea;font-size:11.8px}
  .rm-fix{color:#9db3cf;font-size:11.3px;margin-top:1px}
  .dsh-tag{display:inline-block;font:9.5px/1.4 ui-monospace,Consolas,monospace;padding:0 5px;border-radius:5px;margin-right:6px;font-weight:700;vertical-align:1px}
  .tag-new{color:#86efac;background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.32)}
  .tag-done{color:#94a3b8;background:rgba(148,163,184,.12);border:1px solid rgba(148,163,184,.3)}
  .tag-skip{color:#fda4af;background:rgba(244,114,182,.12);border:1px solid rgba(244,114,182,.32)}
  .dsh-src{color:#9db3cf;font:10px/1.5 ui-monospace,Consolas,monospace}
  .dsh-item{margin:6px 0}
  .dsh-d{color:#c7d7ea;font-size:11.8px;margin-top:1px}
  .nb{display:flex;flex-direction:column;gap:4px}
  .nb button{text-align:left;background:rgba(148,163,184,.06);border:1px solid var(--line);color:#cfdcee;
    padding:5px 9px;border-radius:7px;font-size:11.5px;cursor:pointer}
  .nb button:hover{border-color:#3b82f6;background:rgba(59,130,246,.12)}
  .hint{font-size:11.5px;color:#7b92ae;line-height:1.75}
  .hint kbd{font:10.5px/1 ui-monospace,Consolas,monospace;border:1px solid #2a3b52;border-bottom-width:2px;
    border-radius:5px;padding:1px 5px;background:#101a2b;color:#b7c9de}
  .close{position:absolute;top:12px;right:14px;border:none;background:none;color:#7b92ae;font-size:18px;cursor:pointer}
  .close:hover{color:#e6eefb}
  .foot{position:absolute;left:14px;bottom:11px;font-size:10.5px;color:#59718f;pointer-events:none}
  @media (prefers-reduced-motion: reduce){
    .eye-group,.chest-anim,.heart-anim,#bodySway,gBody.bounce{animation:none !important}
  }
  @media (max-width:860px){
    .drawer{width:100%;max-width:none} input[type=search]{width:150px;font-size:16px}
    #behaviorHint{max-width:100%}
  }
</style>
</head>
<body>
<header>
  <div class="row1">
    <div class="brand"><h1>AIJiYi 人体架构</h1><span class="ver">schema v11 · v0.8.3 · 成人身体 / 儿童行为</span></div>
    <div class="stats" id="stats"></div>
    <div class="spacer"></div>
    <div class="tools">
      <input type="search" id="q" placeholder="搜索模块 / 文件 / 关键词  与 / 定位" aria-label="搜索">
      <button class="btn" id="mainpath" title="只高亮「一次对话」的主链路">主链路</button>
      <button class="btn" id="fit" title="适应窗口 (F)">适应</button>
      <button class="btn" id="zin" title="放大 (+)">+</button>
      <button class="btn" id="zout" title="缩小 (−)">−</button>
    </div>
  </div>
  <div class="row2">
    <div id="behaviorHint"><b>开放接入</b>：QQ 只是其一，微信 / 抖音 / B站 / 任意外部网站都能接；<b>行为像儿童</b>：好奇盯着你看、爱眨眼、心跳呼吸更快、天真直白、爱模仿、记得快忘得快 —— 68 个节点全部常驻（55 个模块 + 外部进程与数据）</div>
    <div id="chips"></div>
    <div class="legend">
      <span><svg width="26" height="8"><line x1="0" y1="4" x2="26" y2="4" stroke="#7dd3fc" stroke-width="1.6"/></svg>调用</span>
      <span><svg width="26" height="8"><line x1="0" y1="4" x2="26" y2="4" stroke="#fbbf24" stroke-width="1.6" stroke-dasharray="4 3"/></svg>异步/队列</span>
      <span><svg width="26" height="8"><line x1="0" y1="4" x2="26" y2="4" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="1.5 3"/></svg>数据面</span>
      <span><svg width="26" height="8"><line x1="0" y1="4" x2="26" y2="4" stroke="#7c8ea8" stroke-width="1.6" stroke-dasharray="6 4"/></svg>落库（沿脊柱）</span>
      <span><svg width="26" height="8"><line x1="0" y1="4" x2="26" y2="4" stroke="#f472b6" stroke-width="1.6" stroke-dasharray="4 4"/></svg>外部</span>
    </div>
  </div>
</header>
<main>
  <svg id="stage" xmlns="http://www.w3.org/2000/svg"><defs id="defs"></defs><g id="viewport"><g id="stageLayer"></g></g></svg>
  <aside class="drawer" id="drawer"></aside>
  <div class="foot">成人的身体，儿童的行为：眼睛跟着你转、眨眼、心跳呼吸、摇摆 · 滚轮缩放 / 拖拽平移 / 点节点看说明 · 数据来自 aiji/ 代码与 data/aiji.db 只读实测</div>
</main>

<script>
"use strict";
/* ══════════════════════════════════════════════════════════════
   1. 数据：9 个人体系统 + 68 个节点 + 边（成人完整身体，全常驻）
   ══════════════════════════════════════════════════════════════ */
const BANDS = [
  {id:"entry",   name:"① 感官 · 五官",   cn:"外部世界怎么进来（眼耳口）",     color:"#38bdf8"},
  {id:"ingress", name:"② 咽喉 · 神经通路", cn:"所有入口汇成一条咽喉",         color:"#22d3ee"},
  {id:"orch",    name:"③ 大脑 · 皮层六区", cn:"一次对话怎么被想出来",         color:"#a78bfa"},
  {id:"memory",  name:"④ 记忆 · 海马体",  cn:"写不丢 · 读有预算 · 注入不越权", color:"#34d399"},
  {id:"life",    name:"⑤ 内分泌 · 生命腺", cn:"状态、体检、主动与存在感",      color:"#fbbf24"},
  {id:"out",     name:"⑥ 心脏 · 循环泵",  cn:"从队列到真实送达",             color:"#f472b6"},
  {id:"tools",   name:"⑦ 左手 · 动作",   cn:"受控的动作与联网",             color:"#fb923c"},
  {id:"ops",     name:"⑧ 右手 · 控制",   cn:"看得见、改得动、起停得住",      color:"#60a5fa"},
  {id:"data",    name:"⑨ 骨架 · 双脚地基", cn:"SQLite、素材、模型与账号",      color:"#94a3b8"}
];

const NODES = [
/* ── ① 入口 ── */
{id:"qq", band:"entry", t:"消息平台入口", s:"QQ 已接 · 微信/抖音/B站", f:"platform 开放 · aiji/throat/bridge/",
 d:"QQ 只是其中一个接口。身份字段 platform 开放（cli.py：平台如 wechat / douyin / cli），IM 白名单含 qq、wechat、wecom、douyin、telegram、discord、feishu、dingtalk。两条接入路径：QQ 走 NapCat/OneBot；微信/飞书等走 Octop 网关（负责 QQ/飞书/微信协议归一化）。B站有 /api/social/share/bilibili 分享接口；任何能发 HTTP 的外部网站或系统，都能经 OpenAI 兼容接口或网关 webhook 接入。",
 sym:["platform","wechat","douyin","bilibili"]},
{id:"napcat", band:"entry", t:"NapCat / OneBot", s:"6099 · 接管本机 QQ", f:"（外部进程）",
 d:"用 OneBot 11 协议把本机 QQ 暴露出来。6099 端口在听表示注入层已就绪；它是「启动与结束」页依赖链的第一环。",
 sym:["6099","OneBot 11"]},
{id:"astrbot", band:"entry", t:"AstrBot", s:"6185 · 消息宿主 / 插件", f:"（外部进程）",
 d:"消息处理与插件宿主，AIJiYi 的回复都经它送出。它的 OneBot 服务端在 6199，只有 QQ 登录并连上后才会出现 ESTABLISHED。",
 sym:["6185","6199"]},
{id:"openai_cli", band:"entry", t:"OpenAI 客户端", s:"IDE / IM 网关 / 自建前端", f:"（外部）",
 d:"填 http://127.0.0.1:8787/v1 就是一次接入：/v1/models 做模型发现，/v1/chat/completions 支持普通 JSON 与 SSE 流式。桌宠、IDE、IM 网关不必各写一套。",
 sym:["/v1/models","/v1/chat/completions","SSE"]},
{id:"console", band:"entry", t:"浏览器控制台", s:"127.0.0.1:8787/", f:"aiji/right_hand/web/operations.html",
 d:"4 个主入口：运行总览 / 全部功能 / 功能配置 / 启动与结束。页面状态全部来自实时接口，不使用演示数据；CORS 只放行 null 与本机 8787。",
 sym:["overview","features","settings","lifecycle"]},
{id:"cli", band:"entry", t:"aiji CLI", s:"17 个子命令", f:"aiji/senses/cli.py",
 d:"serve / remember / recall / ingest / inject / feedback / style / media / accounts / stats / doctor / export / bench / forget / archive / self-memory / quota。",
 sym:["doctor","forget","archive","quota"]},
{id:"octop", band:"entry", t:"Octop Gateway", s:"另一条网关适配", f:"aiji/throat/bridge/octop_gateway.py",
 d:"把网关消息翻译成 AIJiYi 的 inbound payload，再走同一个 HTTP 核心；不复制记忆逻辑。",
 sym:["inbound_payload"]},

/* ── ② 接入层 ── */
{id:"server", band:"ingress", t:"HTTP 服务", s:"REST + OpenAI 兼容", f:"aiji/throat/server.py",
 d:"所有入口汇到这一个 ThreadingHTTPServer：身份三字段 (platform, platform_user_id, scope) 解析、API Key 鉴权（HMAC 比较）、CORS 白名单、SSE、/media 只回引用不回字节。探测记录 61 条路由全可达（2026-11-01）。",
 sym:["AijiHTTPServer","_Handler","make_server","parse_identity_hint"]},
{id:"onebot", band:"ingress", t:"OneBot 桥", s:"收事件 + 主动调 action", f:"aiji/throat/bridge/onebot.py",
 d:"parse_event 把 OneBot 事件标准化成 Envelope；OneBotClient / OneBotBridge 负责发送、取头像、拉媒体。群里不带 @ 的消息也会入库（只学不抢话）。",
 sym:["parse_event","OneBotClient","OneBotBridge"]},
{id:"octopb", band:"ingress", t:"网关桥", s:"inbound → 标准请求", f:"aiji/throat/bridge/octop_gateway.py",
 d:"AijiGatewayClient 把网关侧的消息换成 AIJiYi 请求；进程内直接跑，省一次网络往返。",
 sym:["AijiGatewayClient","make_processor"]},
{id:"clib", band:"ingress", t:"CLI 入口", s:"argparse · 单进程", f:"aiji/senses/cli.py",
 d:"命令行是「不装服务也能用」的入口：直接打开同一个 Memory 门面，落同一个库。doctor 会告诉你缺哪把 key、哪条路由在场。",
 sym:["_memory","_ident","cmd_serve"]},
{id:"netguard", band:"ingress", t:"URL 护栏", s:"公网放行 / 私网拦截", f:"aiji/throat/net_guard.py",
 d:"双向作用，且没有域名白名单。所有用户可控的抓取先过这里：只要求 http(s)、端口 80/443、DNS 解析后排除私有/回环/链路本地/保留地址（防 SSRF）；任意公网域名都能通过——它同时是主动访问任意外部公网网站/API 的放行通道（点歌、表情包更新、网页抓取、MCP 搜索）。",
 sym:["validate_public_http_url","UrlGuardError"]},

/* ── ③ 编排层 ── */
{id:"head", band:"orch", t:"对话头", s:"Head.reply() · 无状态", f:"aiji/brain/head.py",

function mk(x,y,w,h){ return {x,y,w,h,cx:x+w/2,cy:y+h/2}; }
const pos = {};
ORGAN_GROUPS.forEach(g=>{
  const ns = g.nodes.map(id=>NODES.find(n=>n.id===id));
  if(g.kind === "grid"){
    const rows = Math.ceil(ns.length/g.cols);
    const gw = g.cols*g.nodeW + (g.cols-1)*g.gapX;
    const gh = rows*g.nodeH + (rows-1)*g.gapY;
    const x0 = g.cx-gw/2, y0 = g.cy-gh/2;
    ns.forEach((nd,i)=>{
      const r=Math.floor(i/g.cols), c=i%g.cols;
      pos[nd.id]=mk(x0+c*(g.nodeW+g.gapX), y0+r*(g.nodeH+g.gapY), g.nodeW, g.nodeH);
    });
  } else if(g.kind === "rows"){
    let yy=g.yTop, i=0;
    g.rows.forEach(rn=>{
      const rw=rn*g.nodeW+(rn-1)*g.gapX, rx=g.cx-rw/2;
      for(let c=0;c<rn;c++,i++){
        const nd=ns[i]; if(!nd) return;
        pos[nd.id]=mk(rx+c*(g.nodeW+g.gapX), yy, g.nodeW, g.nodeH);
      }
      yy+=g.nodeH+g.gapY;
    });
  } else if(g.kind === "col"){
    let yy=g.yTop;
    ns.forEach(nd=>{ pos[nd.id]=mk(g.cx-g.nodeW/2, yy, g.nodeW, g.nodeH); yy+=g.nodeH+g.gapY; });
  } else if(g.kind === "single"){
    pos[ns[0].id]=mk(g.cx-g.nodeW/2, g.cy-g.nodeH/2, g.nodeW, g.nodeH);
  } else if(g.kind === "legs"){
    const half=Math.ceil(ns.length/2);
    ns.forEach((nd,i)=>{
      const x = i<half?g.xL:g.xR, j=i<half?i:i-half;
      pos[nd.id]=mk(x-g.nodeW/2, g.yTop+j*(g.nodeH+g.gapY), g.nodeW, g.nodeH);
    });
  }
});

function pathFor(e){
  const a = pos[e.a], b = pos[e.b];
  if(!a || !b) return null;
  if(e.k === "db"){
    const sy = a.y + a.h/2, ty = b.y + b.h/2;
    return {d:`M${a.x+a.w},${sy} L${SPINE_X},${sy} L${SPINE_X},${ty} L${b.x+b.w},${ty}`,
            x:(SPINE_X + b.x+b.w)/2, y:ty-6};
  }
  if(e.a === e.b) return null;
  const sameBand = Math.abs(a.y - b.y) < 1;
  if(sameBand){
    if(b.x > a.x){
      const x1=a.x+a.w, y1=a.y+a.h/2, x2=b.x, y2=b.y+b.h/2;
      return {d:`M${x1},${y1} C${x1+30},${y1} ${x2-30},${y2} ${x2},${y2}`, x:(x1+x2)/2, y:y1-7};
    }
    const dip = a.y + a.h + 30;
    const x1=a.x+a.w/2, x2=b.x+b.w/2;
    return {d:`M${x1},${a.y+a.h} C${x1},${dip} ${x2},${dip} ${x2},${b.y+b.h}`, x:(x1+x2)/2, y:dip};
  }
  if(b.y > a.y){
    const x1=a.x+a.w/2, y1=a.y+a.h, x2=b.x+b.w/2, y2=b.y;
    const dy = Math.max(26, (y2-y1)*0.48);
    return {d:`M${x1},${y1} C${x1},${y1+dy} ${x2},${y2-dy} ${x2},${y2}`,
            x:(x1+x2)/2, y:(y1+y2)/2};
  }
  const x1=a.x+a.w/2, y1=a.y, x2=b.x+b.w/2, y2=b.y+b.h;
  const dy = Math.max(30, (y1-y2)*0.45);
  return {d:`M${x1},${y1} C${x1},${y1-dy} ${x2},${y2+dy} ${x2},${y2}`,
          x:(x1+x2)/2, y:(y1+y2)/2};
}

const edgeEl = {};
const adj = {}; NODES.forEach(n=>{ adj[n.id] = new Set(); });
EDGES.forEach((e,idx)=>{
  const p = pathFor(e);
  if(!p) return;
  const path = el("path", {class:"edge k-"+e.k, d:p.d, "marker-end":`url(#arw-${e.k})`}, gEdges);
  edgeEl[idx] = path;
  if(e.l){
    const lab = el("text", {class:"lbl", x:p.x, y:p.y, "text-anchor":"middle"}, gLabels);
    lab.textContent = e.l; e._lab = lab;
  }
  adj[e.a] && adj[e.a].add(e.b);
  adj[e.b] && adj[e.b].add(e.a);
});

/* ══════════════════════════════════════════════════════════════
   4. 视图变换
   ══════════════════════════════════════════════════════════════ */
const view = {k:1, tx:0, ty:0, min:.15, max:2.4};
function applyView(){
  VP.setAttribute("transform", `matrix(${view.k},0,0,${view.k},${view.tx},${view.ty})`);
}
function availW(){
  const r = SVG.getBoundingClientRect();
  const d = drawer.classList.contains("open") ? Math.min(392, r.width*0.46) : 0;
  return r.width - d;
}
function fit(){
  const r = SVG.getBoundingClientRect();
  const aw = availW();
  const kk = Math.min((aw-30)/W, (r.height-30)/H);
  view.k = Math.max(view.min, Math.min(view.max, kk));
  view.tx = (aw - W*view.k)/2;
  view.ty = (r.height - H*view.k)/2;
  applyView();
}
function zoomAt(factor, cx, cy){
  const r = SVG.getBoundingClientRect();
  const px = (cx ?? availW()/2), py = (cy ?? r.height/2);
  const nk = Math.max(view.min, Math.min(view.max, view.k*factor));
  const ratio = nk/view.k;
  view.tx = px - (px - view.tx)*ratio;
  view.ty = py - (py - view.ty)*ratio;
  view.k = nk;
  applyView();
}
SVG.addEventListener("wheel", ev=>{
  ev.preventDefault();
  const r = SVG.getBoundingClientRect();
  zoomAt(Math.pow(1.0016, -ev.deltaY), ev.clientX-r.left, ev.clientY-r.top);
  applyLabels();
}, {passive:false});

let drag = null;
SVG.addEventListener("pointerdown", ev=>{
  if(ev.button !== 0) return;
  drag = {x:ev.clientX, y:ev.clientY, tx:view.tx, ty:view.ty, moved:false};
  SVG.classList.add("dragging");
  SVG.setPointerCapture(ev.pointerId);
});
SVG.addEventListener("pointermove", ev=>{
  if(!drag) return;
  const dx = ev.clientX-drag.x, dy = ev.clientY-drag.y;
  if(Math.abs(dx)+Math.abs(dy) > 3) drag.moved = true;
  view.tx = drag.tx + dx; view.ty = drag.ty + dy;
  applyView();
});
function endDrag(ev){
  if(!drag) return;
  const moved = drag.moved;
  drag = null;
  SVG.classList.remove("dragging");
  try{ SVG.releasePointerCapture(ev.pointerId); }catch(_){}
  if(!moved) pin(null);
}
SVG.addEventListener("pointerup", endDrag);
SVG.addEventListener("pointercancel", endDrag);

const HEAD_CX = 950, HEAD_EYE_Y = 440;
function toLocal(clientX, clientY){
  const pt = SVG.createSVGPoint();
  pt.x = clientX; pt.y = clientY;
  const ctm = VP.getScreenCTM();
  return ctm ? pt.matrixTransform(ctm.inverse()) : {x:HEAD_CX, y:HEAD_EYE_Y};
}
function updateGaze(clientX, clientY){
  const p = toLocal(clientX, clientY);
  const dx = p.x - HEAD_CX, dy = p.y - HEAD_EYE_Y;
  const dist = Math.hypot(dx,dy) || 1;
  const max = 7;
  const ox = (dx/dist) * Math.min(max, dist/28);
  const oy = (dy/dist) * Math.min(max, dist/28);
  pupilWraps.forEach(w=>w.setAttribute("transform", `translate(${ox},${oy})`));
}
function resetGaze(){
  pupilWraps.forEach(w=>w.setAttribute("transform", "translate(0,0)"));
}
SVG.addEventListener("pointermove", ev=>{
  updateGaze(ev.clientX, ev.clientY);
});
SVG.addEventListener("pointerleave", resetGaze);

/* ══════════════════════════════════════════════════════════════
   6. 高亮 / 搜索 / 分层开关
   ══════════════════════════════════════════════════════════════ */
let hoverId = null, pinned = null, mainMode = false, query = "";
const offBands = new Set();
const drawer = document.getElementById("drawer");

function matches(nd, q){
  if(!q) return true;
  const hay = [nd.t, nd.s, nd.f, nd.d, nd.band, (nd.sym||[]).join(" ")].join(" ").toLowerCase();
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(w=>hay.includes(w));
}
function apply(){
  const q = query.trim();
  const hits = q ? new Set(NODES.filter(n=>matches(n,q)).map(n=>n.id)) : null;
  const active = pinned || hoverId;
  const hood = active ? new Set([active, ...(adj[active]||[])]) : null;

  NODES.forEach(nd=>{
    const g = nodeEl[nd.id];
    const off = offBands.has(nd.band);
    g.classList.toggle("off", off);
    const dim = off ||
      (mainMode && !MAIN.has(nd.id)) ||
      (hits && !hits.has(nd.id)) ||
      (hood && !hood.has(nd.id));
    g.classList.toggle("dim", !!dim && !off);
    g.classList.toggle("sel", pinned === nd.id);
    g.classList.toggle("hit", !!(hits && hits.has(nd.id) && !dim));
  });

  EDGES.forEach((e,idx)=>{
    const g = edgeEl[idx]; if(!g) return;
    const off = offBands.has(e.a) || offBands.has(e.b);
    const hl = !!active && (e.a === active || e.b === active);
    const dim = off ||
      (mainMode && !(MAIN.has(e.a) && MAIN.has(e.b))) ||
      (hits && !(hits.has(e.a) && hits.has(e.b))) ||
      (hood && !hl);
    g.classList.toggle("hl", hl && !dim);
    g.classList.toggle("dim", !!dim);
    if(e._lab){
      const on = (hl && !dim) || (q && !dim) || (!dim && view.k > 1.25);
      e._lab.classList.toggle("on", !!on);
    }
  });
  applyLabels();
  if(pinned) showDetail(pinned);
}
function applyLabels(){
  EDGES.forEach(e=>{
    if(!e._lab) return;
    if(!e._lab.classList.contains("on") && view.k > 1.25 && !e._lab.classList.contains("dim"))
      e._lab.classList.add("on");
  });
}

function readHash(){
  const h = decodeURIComponent((location.hash || "").slice(1));
  return NODES.some(n=>n.id === h) ? h : null;
}
function pin(id){
  pinned = id;
  if(id){ showDetail(id); playfulReact(); }
  else if(drawer.classList.contains("open")) overview();
  apply();
  try{ history.replaceState(null, "", location.pathname + location.search + (id ? "#"+id : "")); }catch(_){}
}
window.addEventListener("hashchange", ()=>{
  const h = readHash();
  if(h !== pinned) pin(h);
});

document.addEventListener("keydown", ev=>{
  const inField = /input|textarea/i.test(ev.target.tagName);
  if(ev.key === "Escape"){
    if(query){ qInput.value=""; query=""; apply(); }
    else { pinned = null; drawer.classList.remove("open"); apply(); }
    return;
  }
  if(inField) return;
  if(ev.key === "/"){ ev.preventDefault(); qInput.focus(); }
  else if(ev.key === "f" || ev.key === "F"){ fit(); }
  else if(ev.key === "0"){ view.k=1; view.tx=0; view.ty=0; applyView(); }
  else if(ev.key === "+" || ev.key === "="){ zoomAt(1.22); }
  else if(ev.key === "-" || ev.key === "_"){ zoomAt(1/1.22); }
});
