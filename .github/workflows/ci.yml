name: Tests

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m compileall -q aiji
      - run: python -m unittest tests.test_heart tests.test_cognitive tests.test_data_repair tests.test_pet_growth tests.test_janitor tests.test_media_audio -q
